name: Revisar precios LG/Samsung

on:
  schedule:
    # Todos los días a las 13:00 UTC = 8:00 am hora Bogotá (UTC-5)
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # permite dispararlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  revisar-precios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar scraper de precios
        run: python scrape_precios.py

      - name: Hacer commit si hubo cambios
        run: |
          git config user.name "apartamento-precios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add precios_actuales.json historial_precios.csv screenshots/
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Actualiza precios $(date -u +%Y-%m-%d)"
          git push
